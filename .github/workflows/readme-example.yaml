name: README example

# The Go example in README.md must build against this checkout.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: scripts/check-readme-example.sh
